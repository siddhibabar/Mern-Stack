<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Modal Popup</title>
    <link rel="stylesheet" href="modal.css">
</head>
<body>


    <a href="#modal" class="open-btn">View Special Offer</a>


    <div id="modal" class="modal">
        <div class="modal-box">

            <div class="modal-header">
                <h2>Special Offer 🎉</h2>
                <a href="#" class="close-btn">&times;</a>
            </div>

            <div class="modal-body">
                <p>
                    Enjoy an exclusive <strong>25% discount</strong> on your first purchase.
                    This limited-time deal is available only for new customers.
                </p>

                <p>
                    Sign up today to get early access to new arrivals,
                    faster checkout, and special member-only deals.
                </p>
            </div>

            <div class="modal-footer">
                <a href="#" class="action-btn">Claim Offer</a>
            </div>

        </div>
    </div>

</body>
</html>
